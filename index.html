<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <META NAME="viewport"
content="width=device-width,initial-scale=1.0">
    <title>Student Task Manager</title>
    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">
        <h1>📚 Student Task Manager</h1>
        <button id="themeBtn">🌙 Dark Mode</button>
    <p id="date"></p>

    <div class="input-box">
        <input
            type="text"
            id="taskInput"
            placeholder="Enter your task..."
        >
        <button id="addBtn">Add</button>
    </div>

    <input
        type="text"
        id="search"
        placeholder="🔍 Search tasks..."
    >

    <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="pending">Pending</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
    </div>
    <div class="progress-section">
    <div class="progress-info">
        <span>Progress</span>
        <span id="progressText">0%</span>
    </div>

    <div class="progress-bar">
        <div id="progressFill"></div>
    </div>
</div>
   <p id="emptyMessage" style="display: none;">
    📝 No tasks yet! Add your first task.
   </p>
   <p id="successMessage" style="display:none;">
    🎉 Congratulations! You completed all your tasks.
   </p>

    <ul id="taskList"></ul>
    <div class="bottom">
        <span id="counter">0 Tasks</span>

        <button id="clearCompleted">
            Clear Completed
        </button>
    </div>
    <footer class="footer">
    <p>Developed by <strong>Puja Maharana</strong></p>
    <p>VaultofCodes Web Development Internship 2026</p>
    </footer>

</div>
<script src="script.js"></script>

</body>
</html>
